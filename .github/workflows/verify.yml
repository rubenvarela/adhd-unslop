name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Pins, generated files, tests, version gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history, so the version gate can reach the merge base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Check upstream pins
        run: node tools/sync.mjs --check
      - name: Check generated files
        run: node tools/build.mjs --check
      - name: Run unit tests
        run: node --test tests/*.test.mjs
      - name: Check plugin version bumps
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node tools/version-gate.mjs --base "origin/$BASE_REF"

  load:
    name: Load in pinned Claude Code and Codex
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DISABLE_AUTOUPDATER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # The pins live in tools/cli-versions.json. cli-drift.yml tests the
      # latest releases daily and opens a PR that raises them.
      - name: Install the CLIs
        # The CLIs under test, not build dependencies, so there is no lockfile.
        run: | # zizmor: ignore[adhoc-packages]
          claude_version=$(node -p 'require("./tools/cli-versions.json")["claude-code"]')
          codex_version=$(node -p 'require("./tools/cli-versions.json").codex')
          npm install --global --prefix "$RUNNER_TEMP/cli" \
            "@anthropic-ai/claude-code@$claude_version" \
            "@openai/codex@$codex_version"
          echo "$RUNNER_TEMP/cli/bin" >> "$GITHUB_PATH"
      # No keys and no sign-in. Throwaway homes, deleted at the end.
      - name: Run the load check
        run: node tools/load-check.mjs

  workflows:
    name: Lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color
      - name: zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          advanced-security: false
          annotations: true
