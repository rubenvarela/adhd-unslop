name: Bump upstream skills

on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: upstream-bump
  cancel-in-progress: false

jobs:
  bump:
    name: Bump upstream skills
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the upstream-bump branch
      pull-requests: write # open or update the bump PR
      issues: write # open or comment on the failure issue
      actions: write # dispatch verify.yml on the PR branch
    steps:
      # create-pull-request sets up its own git credentials from its token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # Refetches every pinned file at its pinned commit and compares hashes.
      # A mismatch skips the bump and opens the issue with the mismatch.
      - name: Verify the pins against upstream
        id: verify
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if node tools/sync.mjs --verify-remote > "$RUNNER_TEMP/verify.log" 2>&1; then
            cat "$RUNNER_TEMP/verify.log"
          else
            cat "$RUNNER_TEMP/verify.log"
            {
              echo "# Pinned upstream files do not match upstream"
              echo
              echo "\`sync.mjs --verify-remote\` refetched each pinned file at its pinned commit. These files differ from the sha256 in \`tools/upstream.json\`, so the bump did not run."
              echo
              echo '```'
              cat "$RUNNER_TEMP/verify.log"
              echo '```'
            } > "$RUNNER_TEMP/report.md"
            exit 1
          fi

      # Exits 1 when a bump fails its checks. Successful bumps are kept either way.
      - name: Check upstreams and bump
        id: sync
        if: steps.verify.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/sync.mjs --latest --report "$RUNNER_TEMP/report.md"

      - name: Open or update the bump PR
        id: pr
        if: steps.verify.outcome == 'success'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: upstream-bump
          delete-branch: true
          commit-message: Bump upstream skills
          title: Bump upstream skills
          body-path: ${{ runner.temp }}/report.md
          add-paths: |
            upstream/**
            tools/upstream.json
            tools/plugins.json
            plugins/**
            .claude-plugin/**
            .agents/plugins/**

      # A PR opened with GITHUB_TOKEN does not trigger push or pull_request
      # workflows, but GITHUB_TOKEN may start a workflow_dispatch run.
      - name: Verify the PR branch
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run verify.yml --ref upstream-bump

      - name: Open an issue for a failed bump
        if: steps.verify.outcome == 'failure' || steps.sync.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Upstream bump needs attention"
          existing=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "$RUNNER_TEMP/report.md"
          else
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/report.md"
          fi
